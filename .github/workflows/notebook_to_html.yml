name: Convert Jupyter Notebook to HTML

on:
  push:
    paths:
      - 'notebooks/*.ipynb'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@main
      with:
        ref: main
        fetch-depth: 0 # Fetch all history to have access to the gh-pages branch

    - name: Set up Python
      uses: actions/setup-python@main
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert

    - name: Convert Jupyter Notebooks to HTML
      run: |
        jupyter nbconvert --to html notebooks/*.ipynb

    - name: Commit and push HTML to gh-pages branch
      run: |
        git config --local user.email "eagmon@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin
        mkdir -p /tmp/nb-html
        mv notebooks/*.html /tmp/nb-html/
        git checkout gh-pages || git checkout -b gh-pages
        git pull origin gh-pages || true
        mkdir -p notebooks
        mv /tmp/nb-html/*.html notebooks/
        git add notebooks/*.html
        git diff-index --quiet HEAD || git commit -m "Update notebook HTML"
        git push origin gh-pages || true
